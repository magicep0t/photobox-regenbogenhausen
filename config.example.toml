# Photobox configuration.
# On the Pi this lives at /etc/photobox/config.toml.
# For local development: PHOTOBOX_CONFIG=config.local.toml (git-ignored).
# Every key is optional; the values below are the defaults unless noted.

host = "127.0.0.1"          # keep on localhost: nothing is exposed to the network
port = 8000
photos_dir = "/var/lib/photobox/photos"

[camera]
driver = "picamera2"        # "picamera2" (Pi camera) or "mock" (test images, no hardware)
rotation = 0                # 0 or 180 (camera mounted upside down)
# tuning_file = "ov5647_noir.json"   # only for NoIR modules; default: libcamera picks the right one
# preview_size = [1536, 864]         # default: 1536 px wide in the sensor's aspect ratio
preview_fps = 24            # more only heats up the Pi
# still_size = [2592, 1944]          # default: sensor maximum
jpeg_quality = 92

[ui]
countdown_seconds = 3
mirror_preview = true       # preview acts like a mirror; saved photos are not mirrored
idle_timeout_seconds = 60
default_language = "en"     # "en" or "de"

[hotspot]
# Guest Wi-Fi on a USB stick, so phones can download photos via QR code.
# deploy/setup-pi.sh adds this section with a random password.
enabled = false
ssid = "Photobox"
password = ""               # 8–63 characters; only shown as QR code
country = "DE"
channel = 36                # 5 GHz only: 36, 40, 44 or 48 (short range)
address = "10.42.0.1"       # must match deploy/hotspot/30-photobox-guestwifi.network
port = 80
link_seconds = 300          # a photo link is valid for 5 minutes

[admin_wifi]
# Standalone mode: the built-in Wi-Fi opens this network for the operator
# (laptop, SSH) instead of joining the home Wi-Fi. Switched on the settings
# screen. deploy/setup-pi.sh adds this section with a random password.
enabled = false
ssid = "Photobox-Admin"
password = ""               # 8–63 characters; shown as QR code on the settings screen
country = "DE"
channel = 6                 # 2.4 GHz, 1–13
address = "192.168.73.1"    # must match deploy/admin/10-photobox-wlan0-ap.network

[system]
# Commands behind the buttons on the settings screen; empty = no button.
# deploy/setup-pi.sh sets these, allowed by deploy/polkit/50-photobox.rules:
#   power_off_command = ["systemctl", "poweroff"]
#   reboot_command = ["systemctl", "reboot"]
#   network_mode_command = ["systemctl", "start", "--no-block", "photobox-netmode@{mode}.service"]
#   ssh_password_command = ["systemctl", "start", "photobox-ssh-password@{state}.service"]
power_off_command = []
reboot_command = []
network_mode_command = []
ssh_password_command = []
network_mode_file = "/etc/photobox/network-mode"   # "home" or "standalone", written by netmode.sh
