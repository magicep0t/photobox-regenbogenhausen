[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photobox"
version = "0.0.1"
description = "Raspberry Pi photo booth backend"
license = "MIT"
requires-python = ">=3.11"
# On the Pi these come from Debian packages (python3-fastapi, python3-uvicorn,
# python3-picamera2, python3-pil); see deploy/setup-pi.sh.
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["photobox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
